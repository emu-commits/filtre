; FILTRE — PlatformIO build (sources stay in the Arduino sketch layout, repo root)
[platformio]
src_dir = .
default_envs = cardputer-adv

[env]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
; Cardputer-ADV = ESP32-S3FN8: 8 MB flash, NO PSRAM. Do not add qio_opi / BOARD_HAS_PSRAM.
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
monitor_speed = 115200
build_src_filter = +<*.cpp> +<*.ino> -<tools/> -<test/> -<.pio/>
lib_deps = M5Cardputer=https://github.com/m5stack/M5Cardputer

[env:cardputer-adv]
build_flags = -DESP32S3 -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=1 -DFILTRE_LID_ROTATION=1
